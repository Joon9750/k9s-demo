{{- range .Values.apps }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $.Values.spec.repoURL }}
    targetRevision: {{ $.Values.spec.targetRevision }}
    path: {{ .path }}
  destination:
    server: {{ $.Values.spec.destinationServer }}
    namespace: {{ .namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: {{ $.Values.spec.selfHeal }}
    syncOptions:
      - CreateNamespace=true
---
{{- end }}
